name: check

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: install
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: moon version
        run: |
          moon version --all

      - name: moon check
        run: |
          moon update
          moon check --deny-warn

      - name: moon info
        run: |
          moon info --target all
          git diff --exit-code

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code


  tests:
    name: Full suite (${{ matrix.toolchain }}, ${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: [latest, nightly]
        target: [wasm-gc, native]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "${{ matrix.toolchain }}"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Update dependencies
        run: |
          moon version --all
          moon update
      - name: Run full suite
        run: moon test --target "${{ matrix.target }}"
